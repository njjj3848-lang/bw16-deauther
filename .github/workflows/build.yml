name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: core index
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://github.com/ambiot/ambd_arduino/raw/master/Arduino_package/package_realtek.com_ameba_index.json
          arduino-cli core update-index

      - name: install core
        run: arduino-cli core install realtek:ameba

      - name: libs
        run: arduino-cli lib install U8g2

      - name: list boards
        run: arduino-cli board listall | grep -i 8720 || true

      - name: compile
        run: |
          arduino-cli compile \
            -b realtek:ameba:ameba_rtl8720dn \
            --output-dir out ./bw16_deauther

      - uses: actions/upload-artifact@v4
        with:
          name: bw16-firmware
          path: out/*.bin
