name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Platform Zip
        run: |
          set -e
          URL_MAIN="https://github.com/rzeldent/platform-realtek-ameba/archive/refs/heads/main.zip"
          URL_MASTER="https://github.com/rzeldent/platform-realtek-ameba/archive/refs/heads/master.zip"
          
          echo "trying main..."
          if curl -fsSL -o platform.zip "$URL_MAIN"; then
             echo "got main"
             unzip -q platform.zip
             mv platform-realtek-ameba-main platform-realtek-ameba
          else
             echo "main failed, trying master..."
             curl -fsSL -o platform.zip "$URL_MASTER"
             unzip -q platform.zip
             mv platform-realtek-ameba-master platform-realtek-ameba
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        run: pio run -e bw16

      - uses: actions/upload-artifact@v4
        with:
          name: bw16-firmware
          path: .pio/build/bw16/firmware.bin
