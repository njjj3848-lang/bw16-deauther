name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: download core
        run: |
          CORE=$HOME/.arduino15/packages/realtek/hardware/ameba/3.1.6
          TOOLS=$HOME/.arduino15/packages/realtek/tools/ameba/1.1.3
          mkdir -p $CORE $TOOLS
          
          curl -fsSL -o /tmp/core.tar.gz https://github.com/ambiot/ambd_arduino/raw/master/Arduino_package/release/ameba_d-3.1.6-build20230412.tar.gz
          tar -xzf /tmp/core.tar.gz -C $CORE
          
          curl -fsSL -o /tmp/tools.tar.gz https://github.com/ambiot/ambd_arduino/raw/master/Arduino_package/release/ameba_d_tools_linux-1.1.3.tar.gz
          tar -xzf /tmp/tools.tar.gz -C $TOOLS

      - name: install lib
        run: |
          export PATH="$PWD/bin:$PATH"
          arduino-cli lib install U8g2

      - name: compile
        run: |
          export PATH="$PWD/bin:$PATH"
          arduino-cli compile -b realtek:ameba:ameba_rtl8720dn --output-dir out ./bw16_deauther

      - uses: actions/upload-artifact@v4
        with:
          name: bw16-firmware
          path: out/*.bin
