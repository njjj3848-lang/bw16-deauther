name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Platform Zip
        run: |
          curl -fsSL -o platform.zip https://github.com/rzeldent/platform-realtek-ameba/archive/refs/heads/main.zip
          unzip -q platform.zip
          mv platform-realtek-ameba-main platform-realtek-ameba

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        run: pio run -e bw16

      - uses: actions/upload-artifact@v4
        with:
          name: bw16-firmware
          path: .pio/build/bw16/firmware.bin
