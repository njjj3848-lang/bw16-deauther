name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find & Download Live Platform
        run: |
          set -e
          # ищем на гитхабе репозитории с PlatformIO платформой для амебы
          REPOS=$(curl -s "https://api.github.com/search/repositories?q=platform-realtek-ameba+OR+platformio-ameba" | jq -r '.items[].full_name' | head -n 5)
          
          if [ -z "$REPOS" ]; then
            echo "API ничего не нашёл. пробуем rzeldent напрямую..."
            REPOS="rzeldent/platform-realtek-ameba"
          fi
          
          FOUND=0
          for repo in $REPOS; do
            echo "--- пробуем $repo"
            # узнаём дефолтную ветку
            BRANCH=$(curl -s "https://api.github.com/repos/$repo" | jq -r '.default_branch')
            URL="https://github.com/$repo/archive/refs/heads/$BRANCH.zip"
            echo "качаем $URL"
            if curl -fsSL -o platform.zip "$URL"; then
               unzip -q platform.zip
               DIR=$(ls -d */ | grep -i ameba | head -1)
               if [ -n "$DIR" ]; then
                 mv "$DIR" platform-realtek-ameba
                 echo "УСПЕХ: скачали $repo"
                 FOUND=1
                 break
               fi
            fi
          done
          
          if [ $FOUND -eq 0 ]; then
            echo "Ни один репозиторий не подошёл."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        run: pio run -e bw16

      - uses: actions/upload-artifact@v4
        with:
          name: bw16-firmware
          path: .pio/build/bw16/firmware.bin
